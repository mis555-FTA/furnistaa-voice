<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furnistaa – Speak pointers</title>
<style>
  :root{--green:#0E2C1D;--gold:#BF8535;--goldtx:#6E4A16;--ivory:#FAF6EE;--paper:#FFFDF8;--line:#E2D8C4;--sand:#F1E6D2;--sand2:#EDE4D2;--muted:#5A6B61;--ink:#1F2A24;--btnline:#CDBF9F;
        --serif:Cambria,Georgia,'Times New Roman',serif;--sans:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ivory);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column}
  button,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  header{background:var(--green);padding:14px 20px;display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-family:var(--serif);font-weight:400;font-size:22px;color:var(--ivory)}
  header a{margin-left:auto;color:#D9C9A8;font-size:14px}
  main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .mic{width:150px;height:150px;border-radius:50%;border:0;background:var(--sand);display:flex;align-items:center;justify-content:center;padding:0}
  .mic span{width:112px;height:112px;border-radius:50%;background:var(--gold);color:var(--green);display:flex;align-items:center;justify-content:center}
  .mic.on{box-shadow:0 0 0 10px rgba(191,133,53,.25)}
  .mic.on span{background:var(--green);color:var(--ivory)}
  .time{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:32px;color:var(--green);font-variant-numeric:tabular-nums}
  .time i{width:10px;height:10px;border-radius:50%;background:#B3261E;visibility:hidden}
  .time.on i{visibility:visible;animation:blink 1.2s infinite}
  .state{font-size:14px;color:var(--muted);min-height:20px;text-align:center}
  .seg{display:flex;background:#E6D7B8;border-radius:10px;padding:3px}
  .seg button{height:40px;padding:0 16px;border:0;border-radius:8px;background:transparent;font-size:14px}
  .seg button.on{background:var(--green);color:var(--ivory);font-weight:600}
  textarea{width:100%;min-height:200px;resize:vertical;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;line-height:1.7}
  .interim{width:100%;font-size:14px;color:var(--muted);font-style:italic;min-height:20px}
  .msg{width:100%;font-size:14px;line-height:1.5;color:#7A2E1A;background:#F6E3DA;border-radius:8px;padding:12px 14px}
  .acts{width:100%;display:flex;gap:10px}
  .btn{height:50px;padding:0 18px;border-radius:10px;border:1px solid var(--btnline);background:transparent;font-size:15px}
  .btn.done{flex:1;background:var(--gold);border-color:var(--gold);color:var(--green);font-weight:700}
  .btn:disabled{opacity:.5;cursor:default}
  [hidden]{display:none!important}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#BF8535" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  <h1>Speak pointers</h1>
  <a id="back" href="#">Back</a>
</header>
<main>
  <button class="mic" id="mic" aria-label="Start recording"><span><svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span></button>
  <div class="time" id="timeWrap"><i></i><span id="time">00:00</span></div>
  <div class="state" id="state" aria-live="polite">Tap the mic and say your tasks. Pause between tasks.</div>
  <div class="seg" role="group" aria-label="Spoken language" id="lang">
    <button type="button" data-lang="en-IN" class="on">English</button>
    <button type="button" data-lang="hi-IN">Hindi</button>
    <button type="button" data-lang="en-IN" data-alt="hinglish">Hinglish</button>
  </div>
  <div class="msg" id="msg" hidden></div>
  <textarea id="text" aria-label="Transcript" placeholder="Your words appear here. You can correct them before sending."></textarea>
  <div class="interim" id="interim"></div>
  <div class="acts">
    <button class="btn" id="clear" type="button">Clear</button>
    <button class="btn done" id="done" type="button">Done — make pointers</button>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const RET = qs.get('return') || '';
const RET_OK = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/(exec|dev)$/.test(RET);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const R = { on:false, rec:null, secs:0, t0:0, tick:null, lastEvt:0, pendingBreak:false, lang: qs.get('lang') || 'en-IN' };

function msg(t){ $('msg').hidden = !t; $('msg').textContent = t || ''; }
function pad(n){ return String(n).padStart(2,'0'); }
function clock(s){ return pad(Math.floor(s/60)) + ':' + pad(s%60); }

if (RET_OK) $('back').href = RET; else $('back').hidden = true;
if (!RET_OK) msg('Open this page from the Pointers app (Speak pointers → mic) so your pointers can be sent back.');
if (!SR) msg('Voice input isn’t supported in this browser. Use Chrome, Edge or Safari — or dictate with your keyboard’s mic into the box below.');
document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === R.lang && !b.dataset.alt));

function start(){
  if (!SR) return;
  msg(RET_OK ? '' : $('msg').textContent);
  const rec = new SR();
  rec.lang = R.lang; rec.continuous = true; rec.interimResults = true;
  R.pendingBreak = !!$('text').value.trim(); R.lastEvt = Date.now();
  rec.onresult = e => {
    const t = Date.now();
    if (t - R.lastEvt > 1200) R.pendingBreak = true;          // pause before this phrase → new pointer
    R.lastEvt = t;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i], s = r[0].transcript.trim();
      if (!s) continue;
      if (r.isFinal){
        const ta = $('text'), cur = ta.value.replace(/\s+$/, '');
        ta.value = cur ? cur + (R.pendingBreak ? '\n' : ' ') + s : s;
        R.pendingBreak = false;
      } else interim += r[0].transcript;
    }
    $('interim').textContent = interim;
  };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed')
      msg('Microphone access was refused. Click the lock/settings icon in the address bar, set Microphone to Allow, and reload.');
    else if (e.error === 'network')
      msg('Speech service couldn’t be reached. Check the internet connection and try again.');
    else msg('Voice error: ' + e.error);
    stop();
  };
  rec.onend = () => { if (R.on){ try { rec.start(); } catch (_) {} } };   // Chrome stops by itself after silence
  try { rec.start(); } catch (err){ msg('Could not start the mic: ' + err.message); return; }
  R.rec = rec; R.on = true; R.t0 = Date.now() - R.secs * 1000;
  R.tick = setInterval(() => { R.secs = Math.round((Date.now() - R.t0) / 1000); $('time').textContent = clock(R.secs); }, 500);
  ui(true);
}
function stop(){
  R.on = false; clearInterval(R.tick);
  if (R.rec){ try { R.rec.stop(); } catch (_) {} R.rec = null; }
  ui(false);
}
function ui(on){
  $('mic').classList.toggle('on', on);
  $('mic').setAttribute('aria-label', on ? 'Stop recording' : 'Start recording');
  $('timeWrap').classList.toggle('on', on);
  $('state').textContent = on ? 'Listening… pause between tasks. Tap the mic to stop.' : 'Tap the mic to record more, or Done to make pointers.';
  if (!on) $('interim').textContent = '';
}

$('mic').addEventListener('click', () => R.on ? stop() : start());
$('lang').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#lang button').forEach(x => x.classList.toggle('on', x === b));
  R.lang = b.dataset.lang;
  if (R.on){ stop(); start(); }
});
$('clear').addEventListener('click', () => { $('text').value = ''; R.secs = 0; $('time').textContent = '00:00'; });
$('done').addEventListener('click', () => {
  const wasOn = R.on; stop();
  setTimeout(() => {                                          // let the last phrase land
    const t = $('text').value.trim();
    if (!t){ msg('Nothing recorded yet. Tap the mic and speak, or type in the box.'); return; }
    if (!RET_OK){ msg('Open this page from the Pointers app so the pointers can be sent back.'); return; }
    const url = RET + '?t=' + encodeURIComponent(t.slice(0, 5000)) + '&secs=' + R.secs;
    $('done').disabled = true; $('done').textContent = 'Sending…';
    location.href = url;
  }, wasOn ? 500 : 0);
});
</script>
</body>
</html>
